joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1                # 스틱 중립 부근 미세 흔들림 무시
    autorepeat_rate: 20.0        # 스틱 고정 시에도 20Hz 재발행 (하위 watchdog 오작동 방지)
    coalesce_interval_ms: 200    # ← 추가: 20ms 내 이벤트를 병합 → 최대 50Hz

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1                       # 왼쪽 스틱 상하
    scale_linear:
      x: 0.22                    # 평상시 최고 선속도 (m/s) — 처음엔 낮게
    scale_linear_turbo:
      x: 0.40                    # 부스트 시

    axis_angular:
      yaw: 3                     # 오른쪽 스틱 좌우
    scale_angular:
      yaw: 1.0                   # 평상시 최고 각속도 (rad/s)
    scale_angular_turbo:
      yaw: 1.8                   # 부스트 시

    enable_button: 4             # LB — 누르고 있을 때만 동작 (데드맨)
    enable_turbo_button: 5       # RB — 부스트
    require_enable_button: true